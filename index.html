<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Weather Dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;600&display=swap" rel="stylesheet" />
  <title>Weather Dashboard</title>

  <style>
    /* ─── RESET & BASE ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080c10;
      --panel-bg:     #0d1520;
      --border:       rgba(0,200,255,0.13);
      --border-glow:  rgba(0,200,255,0.35);
      --accent-cyan:  #00c8ff;
      --accent-amber: #e8a020;
      --accent-green: #00ff88;
      --accent-red:   #ff3b30;
      --accent-orange:#ff6b00;
      --text-dim:     #6a8090;
      --text-mid:     #a0b8c8;
      --text-bright:  #d8eef8;
      --font-mono:    'Share Tech Mono', monospace;
      --font-cond:    'Roboto Condensed', sans-serif;
      --font-display: 'Bebas Neue', sans-serif;
      --topbar-h:     36px;
      --weather-h:    34px;
      --alerts-h:     38px;
      --header-total: 110px; /* topbar + weatherbar + alerts + gaps */
      --main-layout:  auto auto auto auto;
      --main-width:   24.9vw;
      --main-height:  31vh;
      --tile-gap:     2px;
    }

    html, body {
      background: var(--bg);
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font-mono);
      color: var(--text-bright);
    }

    /* ─── SCANLINE OVERLAY ─────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.07) 3px,
        rgba(0,0,0,0.07) 4px
      );
    }

    /* ─── TOP BAR ──────────────────────────────────────────────── */
    .top-bar {
      display: grid;
      grid-template-columns: minmax(0,2fr) minmax(0,1fr) minmax(0,2fr);
      height: var(--topbar-h);
      background: linear-gradient(180deg, #0f1e2e 0%, #091522 100%);
      border-bottom: 1px solid var(--border-glow);
      padding: 0 6px;
      gap: 4px;
      position: relative;
      z-index: 10;
      /* subtle inner glow on bottom edge */
      box-shadow: 0 2px 12px rgba(0,200,255,0.08);
    }

    .top-bar::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-amber), var(--accent-cyan), transparent);
      opacity: 0.6;
    }

    .child {
      display: flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: clamp(13px, 1.7vw, 18px);
      letter-spacing: 0.04em;
      background: transparent;
      border: none;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #topBarLeft  { color: #c8d8e8; justify-content: flex-start; }
    #topBarCenter {
      color: var(--accent-green);
      justify-content: center;
      font-family: var(--font-display);
      font-size: clamp(14px, 1.8vw, 20px);
      letter-spacing: 0.12em;
      text-shadow: 0 0 12px rgba(0,255,136,0.5), 0 0 30px rgba(0,255,136,0.2);
    }
    #topBarRight { color: var(--accent-cyan); justify-content: flex-end; opacity: 0.85; }

    /* ─── WEATHER BAR ─────────────────────────────────────────── */
    .weather-bar {
      height: var(--weather-h);
      background: linear-gradient(180deg, #091522 0%, #060e17 100%);
      border-bottom: 1px solid rgba(0,200,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      overflow: hidden;
      position: relative;
      z-index: 10;
    }
    #weatherBarContent {
      font-family: var(--font-mono);
      font-size: clamp(11px, 1.35vw, 14px);
      color: var(--accent-cyan);
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wx-sep { color: rgba(0,200,255,0.4); margin: 0 6px; }

    /* ─── ALERTS TICKER ────────────────────────────────────────── */
    .alert-ticker {
      position: relative;
      width: 100%;
      height: var(--alerts-h);
      background: #0a1520;
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid rgba(0,200,255,0.15);
      border-bottom: 2px solid rgba(0,200,255,0.25);
      display: flex;
      align-items: center;
    }


    .alert-ticker-content {
      display: inline-block;
      padding-left: 12px;
      animation: ticker var(--alerts-duration, 60s) linear infinite;
      font-family: var(--font-mono);
      font-size: 1.9vh;
      font-weight: bold;
      line-height: var(--alerts-h);
      letter-spacing: 0.04em;
      color: #f5c842;
    }
    .alert-ticker-content a { text-decoration: none; color: #f5c842; }

    /* ─── DASHBOARD GRID ───────────────────────────────────────── */
    .default-frame {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .dashboard {
      display: grid;
      grid-template-columns: var(--main-layout);
      gap: var(--tile-gap);
      flex: 1;
      overflow: hidden;
      background: #050d14; /* gap color */
      padding: var(--tile-gap);
    }

    /* ─── TILE ─────────────────────────────────────────────────── */
    .image-container {
      position: relative;
      height: var(--main-height);
      width: var(--main-width);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: border-color 0.2s;
    }

    .image-container:hover {
      border-color: var(--border-glow);
      box-shadow: inset 0 0 0 1px rgba(0,200,255,0.08), 0 0 8px rgba(0,200,255,0.08);
    }

    .image-container img {
      height: 100%;
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .iframe-tile {
      position: absolute;
      inset: 0;
      border: none;
      width: 100%;
      height: 100%;
      border-radius: 3px;
    }

    /* ─── TILE TITLE ───────────────────────────────────────────── */
    .image-title {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(2,6,12,0.97) 55%);
      color: #e8f4ff;
      font-family: var(--font-cond);
      font-size: clamp(9px, 1.05vw, 13px);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 18px 6px 5px 6px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
    }

    /* ─── FULL-SCREEN & ZOOM ───────────────────────────────────── */
    .iframe-container {
      background: var(--bg);
      border: none;
      position: fixed;
      inset: 0;
      z-index: -2;
    }

    .full-screen {
      background: var(--bg);
      border: none;
      height: 100%;
      width: 98%;
      margin-left: 1%;
    }

    .img-zoom {
      background: rgba(2,6,12,0.96);
      left: 0;
      border: none;
      height: 100%;
      width: 100%;
      position: fixed;
      overflow: hidden;
      bottom: 0;
      z-index: -2;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .img-zoom-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: linear-gradient(180deg, #0f1e2e, #091522);
      border-bottom: 1px solid var(--border-glow);
      flex-shrink: 0;
    }

    .img-zoom-title {
      font-family: var(--font-display);
      font-size: 2vh;
      letter-spacing: 0.15em;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0,200,255,0.4);
    }

    .img-zoom-close {
      font-family: var(--font-mono);
      font-size: 1.4vh;
      color: var(--accent-amber);
      letter-spacing: 0.12em;
      cursor: pointer;
      padding: 4px 12px;
      border: 1px solid rgba(232,160,32,0.4);
      border-radius: 3px;
      transition: background 0.15s;
    }
    .img-zoom-close:hover { background: rgba(232,160,32,0.15); }

    .image-large {
      display: block;
      max-height: calc(100vh - 80px);
      max-width: 98vw;
      width: auto;
      height: auto;
      object-fit: contain;
      cursor: default;
      border: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    .img-zoom-hint {
      font-family: var(--font-mono);
      font-size: 1.1vh;
      color: var(--text-dim);
      margin-top: 10px;
      letter-spacing: 0.06em;
    }

    .media {
      height: 100%;
      width: 100%;
      cursor: pointer;
    }

    .hidden { display: none !important; }


    
    /* ─── OVERLAY / SOURCES ────────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      color: var(--text-bright);
      padding: 40px;
      z-index: 30;
      font-family: var(--font-cond);
    }

    .overlay-content {
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      border-radius: 6px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .close-btn {
      cursor: pointer;
      color: white;
      float: right;
      font-size: 20px;
    }

    /* ─── SETTINGS PAGE ────────────────────────────────────────── */
    .settings-Page {
      display: none;
      font-family: Arial, sans-serif;
      margin-top: 37px;
      background-color: #f0f4f8;
      height: 98%;
      width: 98%;
      margin-left: 1%;
      overflow-y: auto;
    }

    .fixed-section {
      display: none;
      text-align: center;
      position: fixed;
      top: 0;
      left: 1%;
      width: 98%;
      background-color: cadetblue;
      padding-top: 7px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: -3;
    }

    .section { margin-bottom: 20px; display: flex; flex-wrap: wrap; }
    label { margin: 2px; font-weight: bold; }
    input[type="text"]   { width: 90%; padding: 1px; margin-right: 5px; margin-bottom: 3px; }
    input[type="number"] { width: 20%; padding: 1px; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    table th, table td { border: 1px solid #ddd; padding: 8px; }
    table th { background-color: #f4f4f4; }

    button {
      padding: 0 11px;
      margin: 0 0 7px 0;
      cursor: pointer;
      background-image: linear-gradient(#f7f8fa, #e7e9ec);
      border: 1px solid #adb1b8;
      border-radius: 3px;
      color: #0f1111;
      font-size: 13px;
      height: 23px;
      white-space: nowrap;
    }
    button:hover  { border-color: #a2a6ac; }
    button:focus  { border-color: #e77600; box-shadow: rgba(228,121,17,0.5) 0 0 3px 2px; outline: 0; }

    .radio-group { display: flex; align-items: center; }
    .radio-group label { margin-right: 15px; padding-top: 5px; font-weight: normal; }

    /* ─── RSS TICKER (bottom) ──────────────────────────────────── */
    .rss-ticker {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(4,10,18,0.88);
      border-top: 1px solid var(--border);
      overflow: hidden;
      white-space: nowrap;
      padding: 3px 0;
      font-family: var(--font-mono);
      font-size: 1.3vh;
      font-weight: bold;
      z-index: 15;
    }

    .rss-ticker-content {
      display: inline-block;
      padding-left: 100%;
      animation: ticker var(--ticker-duration, 90s) linear infinite;
    }

    .rss-ticker-content a { text-decoration: none; color: var(--accent-amber); }

    /* ─── TICKER KEYFRAME ──────────────────────────────────────── */
    @keyframes ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>

  <script src="wheelzoom.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => console.log('DOMContentLoaded'));
    window.addEventListener('load', () => console.log('Page fully loaded'));

    /* ── Settings section (unchanged logic) ── */
    function getColumnHeaderTitle(tableId, columnNumber) {
      const table = document.getElementById(tableId);
      if (!table) return null;
      const headers = table.querySelectorAll("thead th");
      if (columnNumber < 0 || columnNumber >= headers.length) return null;
      return headers[columnNumber].textContent;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const defaults = {
        settingsSource: "localStorage",
        topBarCenterText: "WEATHER DASHBOARD",
        layout_cols: 4, layout_rows: 3,
        aURL: [["2196F3","Photos","https://picsum.photos/",1,"L"]],
        aImages: Array.from({length:12},(_,i)=>[`Tile ${i+1}`,["https://picsum.photos/seed/picsum/200/300"],30000]),
        aRSS: [["https://www.amsat.org/feed/",60],["https://daily.hamweekly.com/atom.xml",60]],
      };

      settings = JSON.parse(localStorage.getItem("hamdash_config")) || {...defaults};
      if (settings.settingsSource)
        document.querySelector(`input[name="settingsSource"][value="${settings.settingsSource}"]`).checked = true;

      adjustDashboardItems = () => {
        const total = settings.layout_cols * settings.layout_rows;
        const cur   = settings.aImages.length;
        if (cur < total) for (let i=cur;i<total;i++) settings.aImages.push(["",[""],5000]);
        else if (cur > total) settings.aImages.splice(total);
        updateTable("dashboardTable", settings.aImages, ["Tile Title","Tile URLs","URL Rotation Interval (ms)"]);
      };

      updateMenuTable = () => updateTable("menuTable", settings.aURL, ["Color","Text","URL","Scale","Side"]);
      updateFeedTable = () => updateTable("feedTable", settings.aRSS, ["Feed URL","Refresh Interval (minutes)"]);

      const updateTable = (tableId, data, columns) => {
        const tbody = document.querySelector(`#${tableId} tbody`);
        tbody.innerHTML = "";
        data.forEach((item, index) => {
          const row = document.createElement("tr");
          columns.forEach((col, colIndex) => {
            const cell = document.createElement("td");
            if (tableId=="menuTable" && colIndex==0) {
              const c = document.createElement("input"); c.type="color";
              c.value="#"+item[colIndex].replace("#","");
              c.onchange = e => (item[colIndex]=e.target.value);
              cell.appendChild(c);
            } else if (Array.isArray(item[colIndex])) {
              const container = document.createElement("div");
              item[colIndex].forEach((url, urlIndex) => {
                const t = document.createElement("input"); t.type="text"; t.value=url;
                t.onchange = e => (item[colIndex][urlIndex]=e.target.value);
                container.appendChild(t);
                const rb = document.createElement("button"); rb.textContent="Remove URL";
                rb.onclick = () => { item[colIndex].splice(urlIndex,1); updateTable(tableId,data,columns); };
                container.appendChild(document.createElement("br")); container.appendChild(rb); container.appendChild(document.createElement("br"));
              });
              const ab = document.createElement("button"); ab.textContent="Add URL";
              ab.onclick = () => { item[colIndex].push(""); updateTable(tableId,data,columns); };
              container.appendChild(ab); cell.appendChild(container);
            } else {
              const input = document.createElement("input");
              input.type = (getColumnHeaderTitle(tableId,colIndex)==="Scale"||getColumnHeaderTitle(tableId,colIndex)==="URL Rotation Interval (ms)") ? "number" : "text";
              input.value = item[colIndex];
              input.onchange = e => (item[colIndex] = colIndex===2 ? parseInt(e.target.value,10) : e.target.value);
              cell.appendChild(input);
            }
            row.appendChild(cell);
          });
          const ac = document.createElement("td");
          const db = document.createElement("button"); db.textContent="Delete";
          db.onclick = () => { data.splice(index,1); updateTable(tableId,data,columns); adjustDashboardItems(); };
          ac.appendChild(db); row.appendChild(ac); tbody.appendChild(row);
        });
      };

      document.getElementById("CenterText").value   = settings.topBarCenterText;
      document.getElementById("layout_cols").value  = settings.layout_cols;
      document.getElementById("layout_rows").value  = settings.layout_rows;
      updateMenuTable(); updateFeedTable(); adjustDashboardItems();

      document.getElementById("saveConfig").onclick = () => {
        settings.settingsSource     = document.querySelector('input[name="settingsSource"]:checked').value;
        settings.topBarCenterText   = document.getElementById("CenterText").value;
        settings.layout_cols        = parseInt(document.getElementById("layout_cols").value,10);
        settings.layout_rows        = parseInt(document.getElementById("layout_rows").value,10);
        const mr = document.querySelectorAll("#menuTable tbody tr");
        settings.aURL = Array.from(mr).map(r=>{ const c=r.querySelectorAll("td"); return [c[0].querySelector("input").value,c[1].querySelector("input").value,c[2].querySelector("input").value,parseInt(c[3].querySelector("input").value,10),c[4].querySelector("input").value]; });
        const fr = document.querySelectorAll("#feedTable tbody tr");
        settings.aRSS = Array.from(fr).map(r=>{ const c=r.querySelectorAll("td"); return [c[0].querySelector("input").value,parseInt(c[1].querySelector("input").value,10)]; });
        localStorage.setItem("hamdash_config",JSON.stringify(settings));
        alert("Settings saved!");
        updateInputs(); updateMenuTable(); updateFeedTable(); adjustDashboardItems();
      };

      document.getElementById("resetConfig").onclick = () => {
        localStorage.setItem("hamdash_config",JSON.stringify(defaults)); alert("Reset to defaults!");
        settings=defaults; updateInputs(); updateMenuTable(); updateFeedTable(); adjustDashboardItems();
      };
      document.getElementById("deleteConfig").onclick = () => {
        window.localStorage.removeItem('hamdash_config'); alert("Deleted!");
        updateInputs(); updateMenuTable(); updateFeedTable(); adjustDashboardItems();
      };
      document.getElementById("backupConfig").onclick = () => {
        const a=document.createElement("a"); a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(settings));
        a.download="hamdash_config_backup.json"; document.body.appendChild(a); a.click(); a.remove();
      };
      document.getElementById("restoreConfig").onclick = () => {
        const input=document.createElement("input"); input.type="file"; input.accept="application/json";
        input.onchange=e=>{ const r=new FileReader(); r.onload=ev=>{ settings=JSON.parse(ev.target.result); alert("Restored!"); updateInputs(); updateMenuTable(); updateFeedTable(); adjustDashboardItems(); }; r.readAsText(e.target.files[0]); };
        input.click();
      };
      document.getElementById("importConfig").onclick = () => {
        const input=document.createElement("input"); input.type="file"; input.accept=".js";
        input.onchange=e=>{ const r=new FileReader(); r.onload=ev=>{
          const cfg=eval(`(function(){${ev.target.result}return{topBarCenterText,layout_cols,layout_rows,aURL,aIMG,aRSS,tileDelay};})()`);
          const filteredAURL=cfg.aURL.filter(item=>!item.some(s=>typeof s==="string"&&["BACK","Back","Refresh","Sources","Update","Help"].some(k=>s.includes(k))));
          settings={topBarCenterText:cfg.topBarCenterText,layout_cols:cfg.layout_cols,layout_rows:cfg.layout_rows,aURL:filteredAURL,aImages:cfg.aIMG.map((item,i)=>{const[first,...rest]=item;return[first,rest,cfg.tileDelay[i]];}),aRSS:cfg.aRSS,settingsSource:"localStorage"};
          alert("Imported!"); updateInputs(); updateMenuTable(); updateFeedTable(); adjustDashboardItems();
        }; r.readAsText(e.target.files[0]); };
        input.click();
      };
      document.getElementById("exportConfig").onclick = () => {
        const content=`// CUT START\nvar disableSetup = false;\nvar topBarCenterText = "${settings.topBarCenterText}";\nvar layout_cols = ${settings.layout_cols};\nvar layout_rows = ${settings.layout_rows};\nvar aURL = ${JSON.stringify(settings.aURL,null,2)};\nvar aRSS = ${JSON.stringify(settings.aRSS,null,2)};\nvar aIMG = ${JSON.stringify(settings.aImages.map(item=>[item[0],...item[1].flat()]),null,2)};\nvar tileDelay = ${JSON.stringify(settings.aImages.map(item=>item[2]),null,2)};\n// CUT END`;
        const a=document.createElement("a"); a.href="data:text/javascript;charset=utf-8,"+encodeURIComponent(content);
        a.download="config.js"; document.body.appendChild(a); a.click(); a.remove();
      };
      document.getElementById("addMenuItem").onclick  = () => { settings.aURL.push(["","","","",""]); updateMenuTable(); };
      document.getElementById("addFeedItem").onclick  = () => { settings.aRSS.push([""]); updateFeedTable(); };
      document.getElementById("layout_cols").addEventListener("change",()=>{ settings.layout_cols=parseInt(document.getElementById("layout_cols").value,10); adjustDashboardItems(); });
      document.getElementById("layout_rows").addEventListener("change",()=>{ settings.layout_rows=parseInt(document.getElementById("layout_rows").value,10); adjustDashboardItems(); });

      function updateInputs() {
        if(settings.settingsSource) document.querySelector(`input[name="settingsSource"][value="${settings.settingsSource}"]`).checked=true;
        document.getElementById("CenterText").value  = settings.topBarCenterText;
        document.getElementById("layout_cols").value = settings.layout_cols;
        document.getElementById("layout_rows").value = settings.layout_rows;
      }
      function updateValue() {
        topBarCenterText=document.getElementById('CenterText').value;
        document.getElementById('topBarCenter').textContent=topBarCenterText;
      }
      document.getElementById('CenterText').onblur   = updateValue;
      document.getElementById('layout_cols').onblur  = updateValue;
      document.getElementById('layout_rows').onblur  = updateValue;
    });

    /* ── Utility section (unchanged logic) ── */
    function minimalConfiguration() {
      window.disableSetup=false; window.curSettingsSrc="None";
      window.topBarCenterText="WEATHER DASHBOARD"; window.layout_cols=4; window.layout_rows=3;
      window.aURL=[]; window.aIMG=[]; window.aRSS=[]; window.tileDelay=[]; start();
    }

    function loadConfig() {
      const s=document.createElement('script');
      s.src='config.js?_='+Date.now(); // cache-bust so browser always fetches fresh
      s.onload=()=>{ window.curSettingsSrc="config.js"; start(); };
      s.onerror=()=>{ console.error('config.js failed to load'); minimalConfiguration(); };
      document.head.appendChild(s);
    }

    function main() {
      // Always load fresh from config.js — never use localStorage
      localStorage.removeItem('hamdash_config'); // clear any stale saved config
      loadConfig();
    }

    var help="Double click on an image to expand to full screen.\nDouble click again to close full screen view.\nRight click on an image to display the next one.\nImages rotate automatically by default.\n";
    const currentVersion="v2025.04.02";
    async function getLatestVersion() {
      try { const r=await fetch("https://api.github.com/repos/VA3HDL/hamdashboard/releases/latest"); const d=await r.json(); return d.tag_name; } catch(e) { return currentVersion; }
    }
    bUpdate=false;
    async function checkForUpdates() {
      const latest=await getLatestVersion();
      if(currentVersion!==latest) bUpdate=true;
    }

    const videoExtensions=[".mp4",".webm",".ogg",".ogv"];
    function isVideo(src) { return videoExtensions.some(e=>src.includes(e)); }
    function getVideoType(src) { if(src.includes(".mp4")) return "video/mp4"; if(src.includes(".webm")) return "video/webm"; return "video/ogg"; }
    function isFrame(src) { return src.includes("iframe|"); }
    function formatArray(arr) { return arr.map(a=>a.map(i=>typeof i==="string"?`"${i}"`:i).join(", ")).join("<br>"); }

    function setRot() {
      if(typeof tileDelay==="undefined") { aInt[0]=setInterval(()=>slide(),30000); }
      else { tileDelay.forEach((t,i)=>{ if(t>0) aInt[i]=setInterval(()=>slide(i),t); }); }
    }
    function rotStop() {
      if(typeof tileDelay==="undefined") clearTimeout(aInt[0]);
      else tileDelay.forEach((_,i)=>clearTimeout(aInt[i]));
    }

    function MenuOpt(num) {}

    function hideOverlay() { document.getElementById("overlay").style.display="none"; }

    function closeLarge() {
      setRot();
      largeShow=0;
      const z=document.getElementById("imgZoom");
      z.style.display="none";
      z.style.zIndex=-2;
    }

    function openLarge(idx) {
      if(largeShow===1) { closeLarge(); return; }
      window.stop(); rotStop();
      largeShow=1;
      largeIdx=idx;

      // Read the current URL directly from aIMG using aIdx tracker
      const currentUrl = getImgURL(aIMG[idx][aIdx[idx]]);

      const largeImg=document.getElementById("ImageLarge");
      largeImg.src=""; // reset first to force reload
      largeImg.src=currentUrl;

      const titleEl=document.getElementById("imgZoomTitle");
      if(titleEl) titleEl.textContent=aIMG[idx][0]||"";

      const z=document.getElementById("imgZoom");
      z.style.display="flex";
      z.style.zIndex=3;
    }

    // Close on Escape key
    document.addEventListener("keydown", e=>{ if(e.key==="Escape" && largeShow===1) closeLarge(); });

    function getImgURL(url) { return url.includes("?") ? url : url+"?_="+Date.now(); }

    function rotate(event) {
      event.preventDefault();
      const t=event.target||event.srcElement;
      let i=largeShow===1 ? largeIdx : +t.id.replace("Image","");
      if(aIMG[i] && aIMG[i].length>2) {
        ++aIdx[i];
        if(aIdx[i]>aIMG[i].length-1) aIdx[i]=1;
        const nextSrc=getImgURL(aIMG[i][aIdx[i]]);
        if(!isVideo(aIMG[i][aIdx[i]])&&!isFrame(aIMG[i][aIdx[i]])) {
          const tileImg=document.getElementById("Image"+i);
          if(tileImg) tileImg.src=nextSrc;
          if(largeShow===1) document.getElementById("ImageLarge").src=nextSrc;
        }
      }
    }

    function imgRot(i) {
      if(aIMG[i].length>2) { ++aIdx[i]; if(aIdx[i]>aIMG[i].length-1) aIdx[i]=1; }
      const vid=document.getElementById("Video"+i), img=document.getElementById("Image"+i), ifr=document.getElementById("iFrame"+i);
      if(isVideo(aIMG[i][aIdx[i]])) { vid.src=getImgURL(aIMG[i][aIdx[i]]); vid.classList.remove("hidden"); img.classList.add("hidden"); ifr.classList.add("hidden"); }
      else if(isFrame(aIMG[i][aIdx[i]])) { const ns=aIMG[i][aIdx[i]].split("|"); ifr.classList.remove("hidden"); ifr.src=ns[1]; if(ns[2]) ifr.style.transform="scale("+ns[2]+")"; ifr.style.zIndex=0; vid.classList.add("hidden"); img.classList.add("hidden"); }
      else { img.src=getImgURL(aIMG[i][aIdx[i]]); img.classList.remove("hidden"); vid.classList.add("hidden"); ifr.classList.add("hidden"); }
    }

    function slide(i) {
      if(typeof i==="undefined") aIMG.forEach((_,idx)=>imgRot(idx));
      else imgRot(i);
    }

    function updateTickerSpeed() {
      const el=document.querySelector(".rss-ticker-content");
      if(!el) return;
      const dur=(el.scrollWidth+el.parentElement.offsetWidth)/60;
      el.style.setProperty("--ticker-duration",`${dur}s`);
    }

    function fetchAndDisplayRss() {
      const proxy="https://corsproxy.io/";
      const el=document.getElementById("rss-ticker-content");
      const chunks=new Array(aRSS.length).fill("");
      aRSS.forEach(([url,interval],index)=>{
        const fetch1=()=>{
          fetch(proxy+"?url="+encodeURIComponent(url)).then(r=>r.text()).then(txt=>{
            const xml=new DOMParser().parseFromString(txt,"text/xml");
            const tag=xml.querySelector("entry")?"entry":"item";
            const feedTitle=xml.querySelector("channel > title, feed > title")?.textContent||"Feed";
            let out=`<span style="color:#6a8090;font-size:0.9em;"> ${feedTitle} </span> — `;
            xml.querySelectorAll(tag).forEach(item=>{
              const title=item.querySelector("title").textContent;
              const lEl=item.querySelector("link");
              const link=lEl?(lEl.getAttribute("href")||lEl.textContent):"#";
              out+=`<a href="${link}" target="_blank" style="margin-right:40px;">${title}</a>`;
            });
            chunks[index]=out; el.innerHTML=chunks.join(""); updateTickerSpeed();
          }).catch(()=>{});
        };
        fetch1(); setInterval(fetch1,interval*60*1000);
      });
    }

    function start() {
      const lc=typeof window.layout_cols==="undefined"?4:window.layout_cols;
      const lr=typeof window.layout_rows==="undefined"?3:window.layout_rows;
      document.documentElement.style.setProperty("--main-layout","auto ".repeat(lc).trim());
      document.documentElement.style.setProperty("--main-width",(99.6/lc)+"vw");

      /* Height calc: subtract header (topbar + alerts + gaps) */
      const hdrPx = 110; /* 36px topbar + 34px weatherbar + 38px alerts + gaps */
      document.documentElement.style.setProperty("--main-height",`calc((100vh - ${hdrPx}px - ${(lr+1)*2}px) / ${lr})`);

      document.getElementById("currentSettingsSource").innerHTML=curSettingsSrc;
      window.largeShow=0; window.aIdx=[]; window.aInt=[];
      const iTiles=lc*lr;
      for(let i=0;i<iTiles;i++) { aIdx.push(1); aInt.push(null); }

      if(!(aIMG.length===tileDelay.length&&aIMG.length===iTiles)) {
        alert(`Config error! aIMG:${aIMG.length}, tileDelay:${tileDelay.length}, expected:${iTiles}`);
      }




      const dash=document.getElementById("dash");
      aIMG.forEach((arr,index)=>{
        const wrap=document.createElement("div");
        wrap.className="image-container"; wrap.id=`box${index}`;

        const vid=document.createElement("video"); vid.id=`Video${index}`; vid.classList.add("media","hidden");
        vid.controls=true; vid.muted=true; vid.autoplay=true; vid.loop=true;
        const src=document.createElement("source"); vid.appendChild(src);

        const img=document.createElement("img"); img.id=`Image${index}`; img.classList.add("hidden");
        img.oncontextmenu=rotate;
        wrap.onclick=(()=>{ const i=index; return ()=>openLarge(i); })(); wrap.style.cursor='pointer';

        const ifr=document.createElement("iframe"); ifr.className="iframe-tile"; ifr.id=`iFrame${index}`; ifr.classList.add("hidden");

        if(isVideo(arr[1])) { vid.classList.remove("hidden"); src.src=arr[1]; src.type=getVideoType(arr[1]); }
        else if(isFrame(arr[1])) { ifr.classList.remove("hidden"); const ns=arr[1].split("|"); ifr.src=ns[1]; if(ns[2]) ifr.style.transform="scale("+ns[2]+")"; ifr.style.zIndex=0; }
        else {
          img.classList.remove("hidden"); img.src=getImgURL(arr[1]);
          img.onerror=function(){ const txt="Failed to load image"; if(this.src.includes("?")) { this.src=this.src.split("?")[0]; } else { this.src="data:image/svg+xml;base64,"+window.btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330"><text style="font-size:28px;fill:#e8a020;" x="80" y="165">${txt}</text></svg>`); } };
        }

        wrap.appendChild(vid); wrap.appendChild(img); wrap.appendChild(ifr);
        if(arr[0].length>0) { const ttl=document.createElement("div"); ttl.className="image-title"; ttl.innerHTML=arr[0]; wrap.appendChild(ttl); }
        dash.appendChild(wrap);
      });

      wheelzoom(document.querySelectorAll("img"));
      window.addEventListener("resize",()=>window.location.reload());

      if(typeof aRSS!=="undefined"&&aRSS.length>0) {
        const ticker=document.createElement("div"); ticker.id="rss-ticker"; ticker.className="rss-ticker";
        const content=document.createElement("div"); content.id="rss-ticker-content"; content.className="rss-ticker-content";
        ticker.appendChild(content); document.body.appendChild(ticker);
        fetchAndDisplayRss();
        content.addEventListener("mouseenter",()=>content.style.animationPlayState="paused");
        content.addEventListener("mouseleave",()=>content.style.animationPlayState="running");
      }

      setRot();
    }

    /* ── Top bar clock ── */
    function updateTopBar() {
      const now=new Date();
      const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const month=now.getMonth()+1;
      const day=now.getDate();
      const year=now.getFullYear();
      const timeStr=now.toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit",timeZoneName:"short"});
      document.getElementById("topBarLeft").textContent=days[now.getDay()]+"  "+month+"/"+day+"/"+year;
      document.getElementById("topBarCenter").textContent=topBarCenterText;
      document.getElementById("topBarRight").textContent=timeStr;
      const wb=document.getElementById("weatherBarContent");
      if(wb) wb.innerHTML=northPortWeatherStr||"";
    }
    setInterval(updateTopBar,1000);
    checkForUpdates();

    /* ── North Port, FL current weather (NWS API) ── */
    let northPortWeatherStr="";
    let _nwsStationId="";
    let _nwsForecastUrl="";
    let _prevPressurePa=null;
    async function fetchNorthPortWeather(){
      try{
        if(!_nwsStationId){
          const pt=await fetch("https://api.weather.gov/points/27.0442,-82.2359",
            {headers:{"Accept":"application/geo+json","User-Agent":"WeatherDashboard"}});
          const ptd=await pt.json();
          _nwsForecastUrl=ptd.properties.forecast;
          const st=await fetch(ptd.properties.observationStations,
            {headers:{"Accept":"application/geo+json","User-Agent":"WeatherDashboard"}});
          const std=await st.json();
          _nwsStationId=std.features[0].properties.stationIdentifier;
        }
        const hdrs={headers:{"Accept":"application/geo+json","User-Agent":"WeatherDashboard"}};
        const [obsRes,fcstRes]=await Promise.all([
          fetch("https://api.weather.gov/stations/"+_nwsStationId+"/observations/latest",hdrs),
          _nwsForecastUrl?fetch(_nwsForecastUrl,hdrs):Promise.resolve(null)
        ]);
        const od=await obsRes.json();
        const p=od.properties;
        const dirs=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
        const cToF=(c)=>(c!=null)?Math.round(c*9/5+32):null;
        const inStr=(mm)=>(mm!=null?(mm/25.4).toFixed(2)+'"':"0.00\"");
        const S='<span class="wx-sep">◆</span>';

        /* High/low from forecast — more reliable than observation field */
        let hiDay=null,loDay=null;
        if(fcstRes&&fcstRes.ok){
          const fd=await fcstRes.json();
          const periods=fd.properties?.periods||[];
          const dayP=periods.find(pp=>pp.isDaytime);
          const nightP=periods.find(pp=>!pp.isDaytime);
          if(dayP) hiDay=dayP.temperature;
          if(nightP) loDay=nightP.temperature;
        }

        const tempF=cToF(p.temperature?.value);
        const hiF=cToF(p.heatIndex?.value);
        const desc=(p.textDescription||"").toUpperCase();
        const wSpd=p.windSpeed?.value;
        const wDir=p.windDirection?.value;
        const wGust=p.windGust?.value;
        const dpF=cToF(p.dewpoint?.value);
        /* fall back to barometricPressure if seaLevelPressure is null */
        const pressPa=p.seaLevelPressure?.value??p.barometricPressure?.value;
        const p1h=p.precipitationLastHour?.value;
        const p6h=p.precipitationLast6Hours?.value;
        const visM=p.visibility?.value;

        let parts=["<strong>N.PORT FL</strong>"];

        if(tempF!=null) parts.push(hiF!=null?tempF+"°F / FEELS "+hiF+"°F":tempF+"°F");
        if(desc) parts.push(desc);

        if(wSpd!=null){
          const mph=Math.round(wSpd*2.237);
          const dir=(wDir!=null)?dirs[Math.round(wDir/22.5)%16]:"";
          let ws="WIND: "+(dir?dir+" ":"")+mph+"MPH";
          if(wGust!=null) ws+="  GUSTS "+Math.round(wGust*2.237)+"MPH";
          parts.push(ws);
        }

        if(dpF!=null) parts.push("DEW PT "+dpF+"°F");

        if(pressPa!=null){
          let ps=(pressPa/3386.39).toFixed(2)+" inHg";
          if(_prevPressurePa!=null){const d=pressPa-_prevPressurePa; ps+=d>50?" ↑":d<-50?" ↓":" →";}
          _prevPressurePa=pressPa;
          parts.push(ps);
        }

        /* always show precip — 0.00" when no rain reported */
        parts.push("PRECIP: 1HR "+inStr(p1h)+"  6HR "+inStr(p6h));

        if(hiDay!=null||loDay!=null){
          let hl="TODAY:";
          if(hiDay!=null) hl+=" H "+hiDay+"°F";
          if(hiDay!=null&&loDay!=null) hl+=" /";
          if(loDay!=null) hl+=" L "+loDay+"°F";
          parts.push(hl);
        }

        if(visM!=null) parts.push("VIS "+(Math.round(visM/1609.34*10)/10)+" MI");

        northPortWeatherStr=parts.join(" "+S+" ");
      }catch(e){
        console.warn("North Port weather fetch failed:",e);
        if(!northPortWeatherStr) northPortWeatherStr="N.PORT FL: --";
      }
    }
    fetchNorthPortWeather();
    setInterval(fetchNorthPortWeather,10*60*1000);
  </script>

  <!-- ── Alerts Ticker ── -->
  <style>
    /* badge colours */
    .badge-tornado   { color: #ffe8e8; font-family: var(--font-display); font-size: 1.9vh; letter-spacing: 0.1em; }
    .badge-severe    { color: #fff8c0; font-family: var(--font-display); font-size: 1.9vh; letter-spacing: 0.1em; }
    .badge-hurricane { color: #ffe8e8; font-family: var(--font-display); font-size: 1.9vh; letter-spacing: 0.1em; }
    .alert-sep { color: rgba(0,200,255,0.5); margin: 0 14px; font-size: 1.6vh; }
  </style>
</head>

<body onload="main()">

  <div id="iFrameContainer" class="iframe-container">
    <iframe id="FullScreen" class="full-screen" src="" title="Zoom"></iframe>
    <div id="settingsPage" class="settings-Page">
      <div id="fixedSection" class="fixed-section">
        <button id="saveConfig">Save to Local Storage</button>
        <button id="resetConfig">Reset to Defaults</button>
        <button id="deleteConfig">Delete from Local Storage</button>
        <button id="backupConfig">Backup to JSON</button>
        <button id="restoreConfig">Restore from JSON</button>
        <button id="importConfig">Import config.js</button>
        <button id="exportConfig">Export config.js</button>
      </div>
      <h1>Weather Dashboard Setup</h1>
      <div id="configForm">
        <label>Current Settings Source:</label><span id="currentSettingsSource"></span>
        <div class="section">
          <div class="radio-group">
            <label>Settings Source:</label>
            <input type="radio" id="sourceLocalStorage" name="settingsSource" value="localStorage" />
            <label for="sourceLocalStorage">Browser Local Storage</label>
            <input type="radio" id="sourceFile" name="settingsSource" value="file" />
            <label for="sourceFile">config.js file</label>
          </div>
        </div>
        <div class="section">
          <label for="CenterText">Top Bar Center Text:</label>
          <input type="text" id="CenterText" />
        </div>
        <div class="section">
          <label>Grid Layout:</label>
          <label for="layout_cols">Columns:</label><input type="number" id="layout_cols" min="1" />
          <label for="layout_rows">Rows:</label><input type="number" id="layout_rows" min="1" />
        </div>
        <div class="section">
          <label>Menu Items:</label>
          <table id="menuTable"><thead><tr><th>Color</th><th>Text</th><th>URL</th><th>Scale</th><th>Side</th><th>Actions</th></tr></thead><tbody></tbody></table>
          <button id="addMenuItem">Add Menu Item</button>
        </div>
        <div class="section">
          <label>Dashboard Items:</label>
          <table id="dashboardTable"><thead><tr><th>Tile Title</th><th>Tile URLs</th><th>URL Rotation Interval (ms)</th><th>Actions</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="section">
          <label>Feed Items:</label>
          <table id="feedTable"><thead><tr><th>Feed URL</th><th>Refresh Interval (minutes)</th><th>Actions</th></tr></thead><tbody></tbody></table>
          <button id="addFeedItem">Add Feed Item</button>
        </div>
      </div>
    </div>
  </div>

  <div id="imgZoom" class="img-zoom" onclick="closeLarge()">
    <div class="img-zoom-bar">
      <span id="imgZoomTitle" class="img-zoom-title"></span>
      <span class="img-zoom-close" onclick="closeLarge()">✕ CLOSE</span>
    </div>
    <img class="image-large" id="ImageLarge" alt="pic" onclick="event.stopPropagation();" oncontextmenu="rotate(event);" />
    <div class="img-zoom-hint">Click anywhere outside image or press ESC to close</div>
  </div>


  <div id="defaultFrame" class="default-frame">
    <div class="top-bar">
      <div id="topBarLeft"   class="child" style="justify-content:flex-start;">&nbsp;</div>
      <div id="topBarCenter" class="child" style="justify-content:center;">&nbsp;</div>
      <div id="topBarRight"  class="child" style="justify-content:flex-end;">&nbsp;</div>
    </div>
    <div id="weatherBar" class="weather-bar"><span id="weatherBarContent"></span></div>
    <!-- Alerts ticker injected here by JS -->
    <div id="dash" class="dashboard"></div>
  </div>

  <div id="overlay" class="overlay">
    <div class="close-btn" onclick="hideOverlay()">&#10006;</div>
    <div class="overlay-content">
      <div><b>Menu Options:</b><div id="array1"></div></div>
      <div><b>Image Sources:</b><div id="array2"></div></div>
      <div><b>Feed Sources:</b><div id="array3"></div></div>
      <div><b>Development:</b><div id="array4"></div></div>
    </div>
  </div>

  <script>
    /* ── Alerts Ticker ── */
    const ALERT_FEEDS = [
      { url:"https://www.nhc.noaa.gov/index-at.xml",                                                                       label:"HURRICANE (ATL)",   cls:"badge-hurricane", page:"https://www.nhc.noaa.gov/"        },
      { url:"https://www.nhc.noaa.gov/index-ep.xml",                                                                       label:"HURRICANE (EPAC)",  cls:"badge-hurricane", page:"https://www.nhc.noaa.gov/epac.shtml" },
      { url:"https://api.weather.gov/alerts/active.atom?office=TBW&event=Tornado%20Warning",                               label:"TORNADO (TBW)",     cls:"badge-tornado",   page:"https://www.weather.gov/tbw/"     },
      { url:"https://api.weather.gov/alerts/active.atom?office=MFL&event=Tornado%20Warning",                               label:"TORNADO (MFL)",     cls:"badge-tornado",   page:"https://www.weather.gov/mfl/"     },
      { url:"https://api.weather.gov/alerts/active.atom?office=TBW&event=Severe%20Thunderstorm%20Warning",                 label:"SEVERE TSTM (TBW)", cls:"badge-severe",    page:"https://www.weather.gov/tbw/"     },
      { url:"https://api.weather.gov/alerts/active.atom?office=MFL&event=Severe%20Thunderstorm%20Warning",                 label:"SEVERE TSTM (MFL)", cls:"badge-severe",    page:"https://www.weather.gov/mfl/"     },
    ];

    function updateAlertsSpeed() {
      const el=document.querySelector(".alert-ticker-content");
      if(!el) return;
      const dur=(el.scrollWidth+el.parentElement.offsetWidth)/60;
      el.style.setProperty("--alerts-duration",`${dur}s`);
    }

    function mountAlertsTicker() {
      const weatherBar=document.getElementById("weatherBar");
      const div=document.createElement("div");
      div.className="alert-ticker"; div.id="alert-ticker";
      div.innerHTML=`<div class="alert-ticker-content" id="alert-ticker-content"></div>`;
      if(weatherBar&&weatherBar.parentElement) weatherBar.insertAdjacentElement("afterend",div);
      else document.body.prepend(div);
      fetchAndDisplayAlerts();
    }

    function fetchAndDisplayAlerts() {
      const proxy="https://corsproxy.io/";
      const el=document.getElementById("alert-ticker-content");
      if(!el) return;
      const chunks=new Array(ALERT_FEEDS.length).fill("");

      ALERT_FEEDS.forEach(({url,label,cls,page},idx)=>{
        const fetchOne=()=>{
          fetch(proxy+"?url="+encodeURIComponent(url))
            .then(r=>r.text())
            .then(txt=>{
              const xml=new DOMParser().parseFromString(txt,"text/xml");
              const tag=xml.querySelector("entry")?"entry":"item";
              const count=xml.querySelectorAll(tag).length;
              if(count>0){
                chunks[idx]=`<span class="alert-sep">◆</span><a href="${page}" target="_blank"><span class="${cls}"><strong>${label} (${count})</strong></span></a> `;
              } else {
                chunks[idx]=`<span class="alert-sep">◆</span><span class="${cls}" style="opacity:0.35;">${label}</span> `;
              }
              el.innerHTML=chunks.join("");
              updateAlertsSpeed();
            })
            .catch(()=>{
              chunks[idx]=`<span class="alert-sep">◆</span><span class="${cls}" style="opacity:0.25;">${label}</span> `;
              el.innerHTML=chunks.join("");
              updateAlertsSpeed();
            });
        };
        fetchOne();
        setInterval(fetchOne,5*60*1000);
      });

      el.addEventListener("mouseenter",()=>el.style.animationPlayState="paused");
      el.addEventListener("mouseleave",()=>el.style.animationPlayState="running");
    }

    window.addEventListener("load",()=>{ try { mountAlertsTicker(); } catch(e){ console.error(e); } });
  </script>

</body>
</html>
